name: Toyoko Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs every two hours at minute 17.
    - cron: "17 */2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: toyoko-osaka-monitor
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Toyoko Inn availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python toyoko_monitor.py
